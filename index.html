<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santuário e Bestiário dos 200 Dragões</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="fire-particles"></canvas>

    <header class="main-header">
        <div class="header-overlay">
            <h1 class="glowing-title">🐉 SANTUÁRIO DOS 200 DRAGÕES 🐉</h1>
            <p class="subtitle">O Tomo Supremo de Pyrrhia, Pantala e Lendas Mitológicas</p>
        </div>
    </header>

    <main class="container">
        
        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Buscar por nome, elemento, origem ou habilidade...">
            </div>

            <div class="filter-group">
                <button class="filter-btn active" data-type="all">Todos os Dragões</button>
                <button class="filter-btn" data-type="fogo">🔥 Fogo / Céu</button>
                <button class="filter-btn" data-type="ossos">💀 Ossos / Necro</button>
                <button class="filter-btn" data-type="gelo">❄️ Gelo / Neve</button>
                <button class="filter-btn" data-type="noite">🌑 Noite / Sombra</button>
                <button class="filter-btn" data-type="mar">🌊 Mar / Água</button>
                <button class="filter-btn" data-type="folha">🌿 Folha / Natureza</button>
            </div>
        </section>

        <section class="stats-bar">
            <p>Registros ativos no Bestiário: <strong id="dragon-count">0</strong> / 200</p>
        </section>

        <section id="dragons-grid" class="dragons-grid">
            <!-- Os 200 Cards serão gerados aqui via JS -->
        </section>

    </main>

    <!-- Modal de História Completa -->
    <div id="dragon-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer class="main-footer">
        <p>🔥 Forjado com Magia & Código Avançado | 100% Compatível com GitHub Pages 🔥</p>
    </footer>

    <script src="dragonsData.js"></script>
    <script src="script.js"></script>
</body>
</html>
